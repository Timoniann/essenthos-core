name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only unless a job says otherwise: a step that is compromised, or a pull request that edits
# this file, gets a token that can read the repository and write nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

  test:
    name: test
    runs-on: ubuntu-latest

    # The suite is not database-free. 74 of its tests build their own fixtures in Postgres and
    # assert what Postgres accepts, which no in-memory provider would answer honestly. A service
    # container is per-run, so nothing else is dropping this database mid-fixture, which is what
    # happens when two runs share the one on the developer's machine.
    services:
      postgres:
        # The same Postgres the corpus is built, dumped and served with (compose.yaml, deploy/).
        image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
        env:
          POSTGRES_USER: essenthos
          # Not a credential. This Postgres is created for the job and destroyed with it, is
          # reachable only from inside the run, and holds nothing but a scratch schema.
          POSTGRES_PASSWORD: essenthos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U essenthos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      Database__ConnectionString: Host=localhost;Port=5432;Database=essenthos_core_test;Username=essenthos
      Database__Password: essenthos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - name: Test, less the classes that read the corpus
        # The corpus sources are 500+ MB fetched from third parties and are not in any repository,
        # so a runner has none of them. These classes read them and fail outright without them —
        # they do not skip, which is why the count below is a real number rather than a hope.
        # Excluding them here is deliberate: a new class that reads the corpus is not in this list
        # and so goes red on the first run, which is the failure everyone would want to see.
        run: |
          set -euo pipefail
          needs_corpus=(
            BibleDataLoadTests
            CanonicalFrameTests
            CorpusRoundTripTests
            EditionFrameTests
            ElidedMorphemeTests
            EncyclopediaTests
            LetteredVerseFrameTests
            ScrivenerExtractionTests
            SeptuagintLetteredVerseTests
            SeptuagintSecondEsdrasTests
            SyntaxTests
            TextSourceTests
            TextusReceptusOmissionTests
            # Reads Resources/WorldHistory, which the fetch scripts generate and .gitignore keeps
            # out of the repository.
            WorldLayerTests
            # Added 2026-09-04, after the list had gone stale twice. Kept alphabetical; a trait on
            # the class would put the declaration where whoever adds the dependency is typing.
            ByzantineTextformTests
            GreekWitnessReachTests
            OpenBiblePlaceLoadTests
            SamaritanCorpusTests
            SamaritanLinkTests
            SamaritanTests
            SeptuagintTests
            StrongLexiconTests
            StrongTagTests
            StrongXmlParserTests
            TahotSegmentationTests
            UssherAnnalsLoadTests
            UssherAnnalsTests
            UtrReaderTests
          )
          filter=$(printf 'FullyQualifiedName!~%s&' "${needs_corpus[@]}")
          dotnet test --no-restore --filter "${filter%&}"

  image:
    name: image
    runs-on: ubuntu-latest

    # The server pulls this image rather than building one: nothing on the droplet has an SDK, and a
    # rollback is running the previous tag. Pushed only from main, and only after the tests pass, so
    # every tag in the registry is a commit that was green. A pull request builds it and pushes nothing.
    needs: [build, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker build`, not `docker compose build`: compose.yaml interpolates
      # ESSENTHOS_DB_PASSWORD on every command, so compose cannot even parse the file on a runner.
      # Tagged by the full commit, which is what deploy/.env names, and by `main` for convenience —
      # never deployed by `main`, because a tag that moves is not something a rollback can name.
      - name: Build, and push from main
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/essenthos-api
          docker build -f Essenthos.Api/Dockerfile --build-arg SOURCE_COMMIT=${{ github.sha }} -t "$image:${{ github.sha }}" -t "$image:main" .
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            docker push "$image:${{ github.sha }}"
            docker push "$image:main"
          fi
