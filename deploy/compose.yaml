# The whole of a server: one Postgres, production, and a reverse proxy in front. Dev beside it only
# where .env turns it on (COMPOSE_PROFILES=dev and DEV_SITES=on); the production server has none.
#
#   docker compose -f compose.yaml up -d                                  on the server
#   docker compose -f compose.yaml -f compose.rehearsal.yaml up -d        the same, on a workstation
#
# There is deliberately no compose.override.yaml: every file that applies is named on the command line,
# so nothing is applied by accident.
#
# Every value that differs between machines, and every secret, is in .env beside this file. That file
# is never committed; env.example lists what it must hold. A missing required value stops compose before
# any container starts, rather than starting one with an empty password.
#
# Nothing here builds anything. Our two images are built on the workstation and sent to the server by
# scripts/send-images.ps1, tagged by commit; nothing pulls them from a registry. The corpus arrives as
# a release restored by `forge publish` from the machine that built it, which also puts the pictures
# its rows name under HOST_DATA_ROOT/images.

name: ${COMPOSE_PROJECT_NAME:-essenthos}

# Docker's json-file driver grows without limit by default, and a full disk on the box that holds the
# corpus is a bad afternoon. Anchors do not cross compose files, so the rehearsal override repeats it
# wherever it adds a service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

x-api: &api
  image: ${API_IMAGE:?set API_IMAGE to the essenthos-api image tag to run}
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
  # The API holds nothing but the canonical frame and a pool of connections; this stops a leak in it
  # from taking memory the database's page cache is using.
  mem_limit: ${API_MEM_LIMIT:-1g}

x-web: &web
  image: ${WEB_IMAGE:?set WEB_IMAGE to the essenthos-web image tag to run}
  restart: unless-stopped
  logging: *logging
  mem_limit: ${WEB_MEM_LIMIT:-128m}

services:
  db:
    # Pinned by digest, the same image the corpus is built and dumped with on the workstation: a dump
    # restores into its own major version or a later one, and two machines on "latest" eventually
    # disagree about what latest is. Re-pin with
    #   docker buildx imagetools inspect postgres:18.1 --format '{{.Manifest.Digest}}'
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by initdb/10-roles.sh on the first start only, to create the roles and the app databases.
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      # Dev's pair, created only when both are set.
      READER_DEV_PASSWORD: ${READER_DEV_PASSWORD:-}
      APP_DEV_PASSWORD: ${APP_DEV_PASSWORD:-}
    # The memory budget is .env's (DB_* below; deploy/README.md, "Memory"). The defaults are the 8 GB
    # machine's: the database gets at most 4 GB (owner, 2026-10-01). Measured in a 4 GB container
    # (TSK-0920): verify peaks at 2.9 GB with these settings, the reader is as fast as with no limit,
    # and 3 or 4 GB of shared_buffers bought nothing measurable. env.example holds the 4 GB machine's
    # budget. maintenance_work_mem 1GB got a publication's pg_restore -j 4 killed for
    # memory (PRB-0926); 256MB restores in about four minutes.
    mem_limit: ${DB_MEM_LIMIT:-4g}
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${DB_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=${DB_PARALLEL_WORKERS:-2}
    # A parallel hash's workers share memory through /dev/shm, which Docker caps at 64 MB, and what is
    # used there counts against mem_limit. The gate a publication runs peaked at 1,085 MB on the
    # workstation with twice the 8 GB work_mem; with two workers per gather it stays under 1 GB.
    shm_size: ${DB_SHM_SIZE:-1gb}
    volumes:
      # Under HOST_DATA_ROOT with everything else the server keeps. What protects it is the nightly
      # dumps below and their off-site copy; the corpus in it is re-published from the workstation.
      - ${POSTGRES_DATA:-${HOST_DATA_ROOT:?set HOST_DATA_ROOT}/postgres}:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # Where `forge publish` uploads a release; pg_restore reads it from here.
      - ${HOST_DATA_ROOT}/releases:/releases:ro
    # Loopback only, for `forge publish`'s gate and for psql, both through an ssh tunnel.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The accounts schema, migrated by a one-shot run of the API's own image before the API starts —
  # never by the API as it boots, where two containers starting together would race each other.
  api-migrate:
    image: ${API_IMAGE}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=db;Port=5432;Database=corpus;Username=essenthos_reader
      Database__Password: ${READER_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app;Username=essenthos_app
      Accounts__Password: ${APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    environment:
      Urls: http://+:8080
      # The corpus through a role that can SELECT and nothing else. `forge publish` swaps releases by
      # renaming databases, so this name never changes.
      Database__ConnectionString: Host=db;Port=5432;Database=corpus;Username=essenthos_reader
      Database__Password: ${READER_PASSWORD}
      # How long one statement may run before Postgres stops it (StatementTimeout.cs). Five seconds suits
      # an 8 GB machine; on the 4 GB budget a chapter's first, cold read of two texts took 7.6 s and was
      # stopped with a 503 (PRB-1375), so env.example raises it there.
      Database__StatementTimeoutSeconds: ${API_STATEMENT_TIMEOUT_SECONDS:-5}
      # What the warm-up may spend as the API starts (StartupWarmup.cs). The corpus does not change under a
      # running API, so the datasets' counts are kept until it restarts (DatasetEndpoints.cs).
      Warmup__Seconds: ${API_WARMUP_SECONDS:-60}
      Datasets__KeepCountsMinutes: "0"
      # Accounts, which the API owns and writes, through a role that owns that database and no other.
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app;Username=essenthos_app
      Accounts__Password: ${APP_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      # The first admins, by verified address, comma-separated; the admin area names the rest.
      Accounts__BootstrapAdmins: ${ADMIN_EMAILS:-}
      # The reader calls the API on its own origin, so this only matters to another site's script.
      Cors__AllowedOrigins__0: ${SITE_DOMAIN:+https://${SITE_DOMAIN}}
      # The proxy terminates TLS and passes the reader's address on. Its headers are believed from its
      # address alone: the API is limited per reader by that address, and a header anyone else could
      # write would let them be any reader they liked. Without it the API believes every request came
      # over plain http from the proxy, and builds its links and its sign-in callbacks accordingly.
      ForwardedHeaders__KnownProxies: 10.89.0.2
      Images__Path: /images
      # The texts that may be passed on, listed at /v1/downloads from the manifest in this folder, each with
      # a link on this origin: the proxy serves the same folder at /downloads.
      Downloads__Folder: /downloads
      Downloads__BaseUrl: /downloads
      # Each page of the reader written out for search engines and link previews: the address every
      # absolute link names, and the reader's own index.html, read from the web container so the page
      # always names the scripts that container serves. With no domain it is empty, and each page names
      # the address it was asked on.
      Site__Origin: ${SITE_DOMAIN:+https://${SITE_DOMAIN}}
      Site__Shell: http://web:8080/index.html
    volumes:
      # The pictures the corpus's rows name. The rows arrive in the release; `forge publish` puts the
      # files here beside it, one folder per corpus, before it swaps the release in.
      - ${HOST_DATA_ROOT}/images/corpus:/images:ro
      # What `forge publish` sent of `forge export`: the manifest and the files it names.
      - ${HOST_DATA_ROOT}/downloads:/downloads:ro
      # The smaller copies the API makes of them on first request, kept across a restart. Nothing in
      # it is unique: lost, each copy is made again the next time it is asked for.
      - image-cache:/image-cache
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  web:
    <<: *web

  # Dev: started only where COMPOSE_PROFILES names "dev". Not on the production server.
  api-dev-migrate:
    profiles: ["dev"]
    image: ${API_DEV_IMAGE:-${API_IMAGE}}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=db;Port=5432;Database=corpus_dev;Username=essenthos_reader_dev
      Database__Password: ${READER_DEV_PASSWORD:-}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app_dev;Username=essenthos_app_dev
      Accounts__Password: ${APP_DEV_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  api-dev:
    <<: *api
    profiles: ["dev"]
    image: ${API_DEV_IMAGE:-${API_IMAGE}}
    environment:
      Urls: http://+:8080
      Database__ConnectionString: Host=db;Port=5432;Database=corpus_dev;Username=essenthos_reader_dev
      Database__Password: ${READER_DEV_PASSWORD:-}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app_dev;Username=essenthos_app_dev
      Accounts__Password: ${APP_DEV_PASSWORD:-}
      # Google takes several callback addresses on one client, so dev can share production's; GitHub
      # takes one per app, so dev has an app of its own.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_DEV_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_DEV_CLIENT_SECRET:-}
      Accounts__BootstrapAdmins: ${ADMIN_EMAILS:-}
      Cors__AllowedOrigins__0: https://${DEV_DOMAIN:-}
      ForwardedHeaders__KnownProxies: 10.89.0.2
      Images__Path: /images
      Downloads__Folder: /downloads
      Downloads__BaseUrl: /downloads
      Site__Origin: https://${DEV_DOMAIN:-}
      Site__Shell: http://web-dev:8080/index.html
    volumes:
      - ${HOST_DATA_ROOT}/images/corpus_dev:/images:ro
      - ${HOST_DATA_ROOT}/downloads_dev:/downloads:ro
      - image-cache-dev:/image-cache
    depends_on:
      db:
        condition: service_healthy
      api-dev-migrate:
        condition: service_completed_successfully

  web-dev:
    <<: *web
    profiles: ["dev"]
    image: ${WEB_DEV_IMAGE:-${WEB_IMAGE}}

  proxy:
    # Caddy rather than nginx: it obtains and renews the certificates itself, and it resolves the
    # upstream's address on every connection, so an API container restarted onto a new corpus is found
    # at its new address without the proxy being reloaded. lb_try_duration in the Caddyfile holds a
    # request through that restart instead of failing it.
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    logging: *logging
    environment:
      # The bare address, served over plain http while it is set; see the Caddyfile.
      SITE_IP: ${SITE_IP:-}
      IP_SITE: ${SITE_IP:+on}
      # The domain and the API's hostname, with TLS, while SITE_DOMAIN is set.
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      DOMAIN_SITES: ${SITE_DOMAIN:+on}
      STATS_DOMAIN: ${STATS_DOMAIN:-}
      STATS_SITE: ${STATS_DOMAIN:+on}
      # Let's Encrypt writes here about a certificate it could not renew.
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Dev's two hostnames are served only when this is on; see the Caddyfile.
      DEV_SITES: ${DEV_SITES:-off}
      DEV_DOMAIN: ${DEV_DOMAIN:-}
      DEV_API_DOMAIN: ${DEV_API_DOMAIN:-}
      # Each environment's Content-Security-Policy: off, report-only or enforce. See the Caddyfile.
      SITE_CSP: ${SITE_CSP:-off}
      DEV_CSP: ${DEV_CSP:-report-only}
      # Whether production's POST /count reaches Umami (on) or is answered and dropped (off).
      SITE_UMAMI: ${SITE_UMAMI:-off}
      # The key the site serves at /<key>.txt for IndexNow; empty serves nothing.
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      DEV_USER: ${DEV_USER:-}
      # Made with `docker run --rm caddy:2.10-alpine caddy hash-password`.
      DEV_PASSWORD_HASH: ${DEV_PASSWORD_HASH:-}
    networks:
      default:
        ipv4_address: 10.89.0.2
      edge: {}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOST_DATA_ROOT}/caddy/data:/data
      - ${HOST_DATA_ROOT}/caddy/config:/config
      # The downloads, served read-only at /downloads (see the Caddyfile).
      - ${HOST_DATA_ROOT}/downloads:/srv/downloads:ro
      - ${HOST_DATA_ROOT}/downloads_dev:/srv/downloads_dev:ro
      # The updating page's switch: the file `on` in it (see the Caddyfile).
      - ${HOST_DATA_ROOT}/maintenance:/srv/maintenance:ro
      # The access log (see the Caddyfile); housekeeping below rotates it.
      - ${HOST_DATA_ROOT}/logs/caddy:/var/log/caddy
    # Only the start order; Caddy finds an upstream by name on each connection, dev's included.
    depends_on:
      - api
      - web

  backup:
    # The accounts databases are the only thing on this box that cannot be rebuilt, with the page
    # counts beside them where the counter is on. The corpus is an artefact and needs no backup. Each
    # dump is encrypted to the public key in backup-key/ as it is written, and backup-offsite copies
    # the folder off the machine where the owner has named a place.
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # A database the server does not have is skipped, so the counter's is named whether it is on or not.
      BACKUP_DATABASES: essenthos_app essenthos_app_dev essenthos_umami
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      # Without a key in backup-key/ a run writes nothing and fails, unless this is "yes".
      BACKUP_ALLOW_UNENCRYPTED: ${BACKUP_ALLOW_UNENCRYPTED:-}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-26}
    # Unhealthy once any database's last successful dump is older than BACKUP_STALE_HOURS, which a
    # daily run should never let happen: `docker compose ps` says so, where a failing run only logs.
    healthcheck:
      test: ["CMD", "sh", "/backup.sh", "--check"]
      interval: 15m
      timeout: 30s
      retries: 1
      start_period: 1h
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${HOST_DATA_ROOT}/backups:/backups
      # The public key only. The private key that opens the dumps is never on this machine.
      - ${HOST_DATA_ROOT}/backup-key:/backup-key:ro
    depends_on:
      db:
        condition: service_healthy

  # The page counter: Umami, on its own database and role on the same Postgres, with no
  # ClickHouse. It stores a row per page view and per reader's day: the page, the referring site, country,
  # region, city, browser, system, device, screen and language, under a hash of address, browser, date and
  # APP_SECRET (SALT_ROTATION=day, read in v3.4.1's api/send/route.ts and lib/crypto.ts). The address itself
  # is not stored. The location comes from the GeoLite2-City file inside the image, so nothing is looked up
  # elsewhere, and telemetry and the update check are off.
  #
  # Only POST /count reaches it from a site (see the Caddyfile); STATS_DOMAIN is the dashboard. Published on
  # no port. CLIENT_IP_HEADER makes the proxy's header the only one believed, and SKIP_LOCATION_HEADERS
  # refuses the location headers a CDN would write, which here only a visitor could.
  #
  # Three one-shots before the server, each safe to run again: the role and database, the migrations, then
  # the admin's password and the site's row, so the default admin/umami is never live. Keeping them apart
  # also keeps the migration's memory out of the server's start (SKIP_DB_CHECK).
  # Re-pin with
  #   docker buildx imagetools inspect ghcr.io/umami-software/umami:<version> --format '{{.Manifest.Digest}}'
  umami-database:
    profiles: ["analytics"]
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "/umami-setup.sh", "database"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      UMAMI_APP_SECRET: ${UMAMI_APP_SECRET:-}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-}
    volumes:
      - ./umami-setup.sh:/umami-setup.sh:ro
    depends_on:
      db:
        condition: service_healthy

  umami-migrate:
    profiles: ["analytics"]
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    restart: "no"
    logging: *logging
    command: ["sh", "-c", "PATH=/app/node_modules/.bin:$$PATH exec node scripts/check-db.js"]
    environment:
      DATABASE_URL: postgresql://essenthos_umami:${UMAMI_DB_PASSWORD:-}@db:5432/essenthos_umami
    depends_on:
      umami-database:
        condition: service_completed_successfully

  umami-setup:
    profiles: ["analytics"]
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "/umami-setup.sh", "site"]
    environment:
      PGHOST: db
      PGUSER: essenthos_umami
      PGDATABASE: essenthos_umami
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:-}
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - ./umami-setup.sh:/umami-setup.sh:ro
    depends_on:
      umami-migrate:
        condition: service_completed_successfully

  umami:
    profiles: ["analytics"]
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    restart: unless-stopped
    logging: *logging
    mem_limit: ${UMAMI_MEM_LIMIT:-512m}
    environment:
      DATABASE_URL: postgresql://essenthos_umami:${UMAMI_DB_PASSWORD:-}@db:5432/essenthos_umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      SALT_ROTATION: day
      CLIENT_IP_HEADER: x-real-ip
      SKIP_LOCATION_HEADERS: "1"
      SKIP_DB_CHECK: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      PRIVATE_MODE: "1"
      NODE_OPTIONS: --max-old-space-size=${UMAMI_NODE_HEAP_MB:-256}
    depends_on:
      umami-setup:
        condition: service_completed_successfully

  # Once a night: the access log compressed and rotated so that none of it outlives ACCESS_LOG_KEEP_DAYS,
  # and Umami's rows older than UMAMI_KEEP_DAYS deleted, since Umami has no retention of its own. Unhealthy
  # once its last good run is older than a day and a bit.
  housekeeping:
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    init: true
    entrypoint: ["/bin/sh", "/housekeeping.sh"]
    environment:
      HOUSEKEEPING_HOUR_UTC: ${HOUSEKEEPING_HOUR_UTC:-2}
      ACCESS_LOG_KEEP_DAYS: ${ACCESS_LOG_KEEP_DAYS:-28}
      UMAMI_KEEP_DAYS: ${UMAMI_KEEP_DAYS:-730}
      PGHOST: db
      PGUSER: essenthos_umami
      PGDATABASE: essenthos_umami
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD", "sh", "/housekeeping.sh", "--check"]
      interval: 15m
      timeout: 30s
      retries: 1
      start_period: 26h
    volumes:
      - ./housekeeping.sh:/housekeeping.sh:ro
      - ${HOST_DATA_ROOT}/logs/caddy:/logs

  # The encrypted dumps copied off the machine, and the copies there kept as long as the dumps are here.
  # Off unless COMPOSE_PROFILES in .env names it, because where the copy goes is the owner's to choose and
  # to pay for; the remote is defined in rclone.conf beside the data, never in this file.
  backup-offsite:
    profiles: ["offsite"]
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup-offsite.sh"]
    environment:
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup-offsite.sh:/backup-offsite.sh:ro
      - ${HOST_DATA_ROOT}/backups:/backups:ro
      - ${HOST_DATA_ROOT}/rclone:/config/rclone:ro

volumes:
  # In Docker's own storage rather than under HOST_DATA_ROOT, since they hold nothing that cannot be
  # made again. A new volume takes the owner of the image's /image-cache, which is the user the API runs as.
  # image-cache-dev is created only when the dev profile starts api-dev.
  image-cache:
  image-cache-dev:

# One network, with the proxy at a fixed address the APIs are told to believe and every other container
# given one from the upper half. The API is published on no port, so the proxy is the only thing that
# reaches it from outside.
#
# The second network is IPv6 alone and holds the proxy alone. A published port forwards an IPv6 client to
# a container's IPv6 address with the client's own address kept; a container with none gets the connection
# through docker-proxy, from the bridge's address, and every IPv6 reader looks like one. The API stays out
# of it: the proxy still reaches it from 10.89.0.2, the only address it believes. Its name resolves there
# alone, so no connection goes to it over IPv6.
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
          ip_range: 10.89.0.128/25
  edge:
    enable_ipv4: false
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd89:e55e:7405::/64
