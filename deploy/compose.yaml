# The whole of a server: one Postgres, production and dev side by side, and a reverse proxy in front.
#
#   docker compose -f compose.yaml up -d                                  on the droplet
#   docker compose -f compose.yaml -f compose.rehearsal.yaml up -d        the same, on a workstation
#
# There is deliberately no compose.override.yaml: every file that applies is named on the command line,
# so nothing is applied by accident.
#
# Every value that differs between machines, and every secret, is in .env beside this file. That file
# is never committed; env.example lists what it must hold. A missing required value stops compose before
# any container starts, rather than starting one with an empty password.
#
# Nothing here builds anything. The images are built by CI and pulled by tag, and the corpus arrives
# as a release restored by `forge publish` from the machine that built it, which also puts the
# pictures its rows name under HOST_DATA_ROOT/images.

name: ${COMPOSE_PROJECT_NAME:-essenthos}

# Docker's json-file driver grows without limit by default, and a full disk on the box that holds the
# corpus is a bad afternoon. Anchors do not cross compose files, so the rehearsal override repeats it
# wherever it adds a service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

x-api: &api
  image: ${API_IMAGE:?set API_IMAGE to the essenthos-api image tag to run}
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
  # The API holds nothing but the canonical frame and a pool of connections; this stops a leak in it
  # from taking memory the database's page cache is using.
  mem_limit: 1g

x-web: &web
  image: ${WEB_IMAGE:?set WEB_IMAGE to the essenthos-web image tag to run}
  restart: unless-stopped
  logging: *logging
  mem_limit: 128m

services:
  db:
    # Pinned by digest, the same image the corpus is built and dumped with on the workstation: a dump
    # restores into its own major version or a later one, and two machines on "latest" eventually
    # disagree about what latest is. Re-pin with
    #   docker buildx imagetools inspect postgres:18.1 --format '{{.Manifest.Digest}}'
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by initdb/10-roles.sh on the first start only, to create the roles and the app databases.
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD}
      READER_DEV_PASSWORD: ${READER_DEV_PASSWORD:?set READER_DEV_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      APP_DEV_PASSWORD: ${APP_DEV_PASSWORD:?set APP_DEV_PASSWORD}
      # The page counter's role and database, created only when this is set.
      STATS_PASSWORD: ${STATS_PASSWORD:-}
    # The database gets at most 4 GB of the droplet (owner, 2026-10-01), holding production's corpus and
    # its rollback, dev's pair and the app databases in one shared_buffers pool. Measured in a 4 GB
    # container (TSK-0920): verify peaks at 2.9 GB with these settings, the reader is as fast as with
    # no limit, and 3 or 4 GB of shared_buffers bought nothing measurable. maintenance_work_mem 1GB got
    # a publication's pg_restore -j 4 killed for memory (PRB-0926); 256MB restores in about four minutes.
    mem_limit: 4g
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=2
    # A parallel hash's workers share memory through /dev/shm, which Docker caps at 64 MB, and what is
    # used there counts against mem_limit. The gate a publication runs peaked at 1,085 MB on the
    # workstation with twice this work_mem; with two workers per gather it stays under 1 GB.
    shm_size: 1gb
    volumes:
      # On the attached Block Storage volume, with everything else under HOST_DATA_ROOT, so a new
      # machine takes over the data by having the volume attached. Droplet backups do not include
      # a volume: what protects this is the nightly dumps below and their off-site copy.
      - ${POSTGRES_DATA:-${HOST_DATA_ROOT:?set HOST_DATA_ROOT}/postgres}:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # Where `forge publish` uploads a release; pg_restore reads it from here.
      - ${HOST_DATA_ROOT}/releases:/releases:ro
    # Loopback only, for `forge publish`'s gate and for psql, both through an ssh tunnel.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The accounts schema, migrated by a one-shot run of the API's own image before the API starts —
  # never by the API as it boots, where two containers starting together would race each other.
  api-migrate:
    image: ${API_IMAGE}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=db;Port=5432;Database=corpus;Username=essenthos_reader
      Database__Password: ${READER_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app;Username=essenthos_app
      Accounts__Password: ${APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    environment:
      Urls: http://+:8080
      # The corpus through a role that can SELECT and nothing else. `forge publish` swaps releases by
      # renaming databases, so this name never changes.
      Database__ConnectionString: Host=db;Port=5432;Database=corpus;Username=essenthos_reader
      Database__Password: ${READER_PASSWORD}
      # Accounts, which the API owns and writes, through a role that owns that database and no other.
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app;Username=essenthos_app
      Accounts__Password: ${APP_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      # The first admins, by verified address, comma-separated; the admin area names the rest.
      Accounts__BootstrapAdmins: ${ADMIN_EMAILS:-}
      Cors__AllowedOrigins__0: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      # The proxy terminates TLS and passes the reader's address on. Its headers are believed from its
      # address alone: the API is limited per reader by that address, and a header anyone else could
      # write would let them be any reader they liked. Without it the API believes every request came
      # over plain http from the proxy, and builds its links and its sign-in callbacks accordingly.
      ForwardedHeaders__KnownProxies: 10.89.0.2
      Images__Path: /images
      # Each page of the reader written out for search engines and link previews: the address every
      # absolute link names, and the reader's own index.html, read from the web container so the page
      # always names the scripts that container serves.
      Site__Origin: https://${SITE_DOMAIN}
      Site__Shell: http://web:8080/index.html
    volumes:
      # The pictures the corpus's rows name. The rows arrive in the release; `forge publish` puts the
      # files here beside it, one folder per corpus, before it swaps the release in.
      - ${HOST_DATA_ROOT}/images/corpus:/images:ro
      # The smaller copies the API makes of them on first request, kept across a restart. Nothing in
      # it is unique: lost, each copy is made again the next time it is asked for.
      - image-cache:/image-cache
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  web:
    <<: *web

  api-dev-migrate:
    image: ${API_DEV_IMAGE:-${API_IMAGE}}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=db;Port=5432;Database=corpus_dev;Username=essenthos_reader_dev
      Database__Password: ${READER_DEV_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app_dev;Username=essenthos_app_dev
      Accounts__Password: ${APP_DEV_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api-dev:
    <<: *api
    image: ${API_DEV_IMAGE:-${API_IMAGE}}
    environment:
      Urls: http://+:8080
      Database__ConnectionString: Host=db;Port=5432;Database=corpus_dev;Username=essenthos_reader_dev
      Database__Password: ${READER_DEV_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app_dev;Username=essenthos_app_dev
      Accounts__Password: ${APP_DEV_PASSWORD}
      # Google takes several callback addresses on one client, so dev can share production's; GitHub
      # takes one per app, so dev has an app of its own.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_DEV_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_DEV_CLIENT_SECRET:-}
      Accounts__BootstrapAdmins: ${ADMIN_EMAILS:-}
      Cors__AllowedOrigins__0: https://${DEV_DOMAIN:?set DEV_DOMAIN}
      ForwardedHeaders__KnownProxies: 10.89.0.2
      Images__Path: /images
      Site__Origin: https://${DEV_DOMAIN}
      Site__Shell: http://web-dev:8080/index.html
    volumes:
      - ${HOST_DATA_ROOT}/images/corpus_dev:/images:ro
      - image-cache-dev:/image-cache
    depends_on:
      db:
        condition: service_healthy
      api-dev-migrate:
        condition: service_completed_successfully

  web-dev:
    <<: *web
    image: ${WEB_DEV_IMAGE:-${WEB_IMAGE}}

  proxy:
    # Caddy rather than nginx: it obtains and renews the certificates itself, and it resolves the
    # upstream's address on every connection, so an API container restarted onto a new corpus is found
    # at its new address without the proxy being reloaded. lb_try_duration in the Caddyfile holds a
    # request through that restart instead of failing it.
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      DEV_DOMAIN: ${DEV_DOMAIN}
      DEV_API_DOMAIN: ${DEV_API_DOMAIN:?set DEV_API_DOMAIN}
      # Each environment's Content-Security-Policy: off, report-only or enforce. See the Caddyfile.
      SITE_CSP: ${SITE_CSP:-off}
      DEV_CSP: ${DEV_CSP:-report-only}
      # Whether production's /count reaches the page counter (on) or is answered and dropped (off).
      SITE_ANALYTICS: ${SITE_ANALYTICS:-off}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL, the address Let's Encrypt writes to about expiring certificates}
      DEV_USER: ${DEV_USER:?set DEV_USER}
      DEV_PASSWORD_HASH: ${DEV_PASSWORD_HASH:?set DEV_PASSWORD_HASH with `docker run --rm caddy:2.10-alpine caddy hash-password`}
    networks:
      default:
        ipv4_address: 10.89.0.2
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOST_DATA_ROOT}/caddy/data:/data
      - ${HOST_DATA_ROOT}/caddy/config:/config
    depends_on:
      - api
      - web
      - api-dev
      - web-dev

  backup:
    # The accounts databases are the only thing on this box that cannot be rebuilt, with the page
    # counts beside them where the counter is on. The corpus is an artefact and needs no backup. Each
    # dump is encrypted to the public key in backup-key/ as it is written, and backup-offsite copies
    # the folder off the machine where the owner has named a place.
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # A database the server does not have is skipped, so the counter's is named whether it is on or not.
      BACKUP_DATABASES: essenthos_app essenthos_app_dev essenthos_stats
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      # Without a key in backup-key/ a run writes nothing and fails, unless this is "yes".
      BACKUP_ALLOW_UNENCRYPTED: ${BACKUP_ALLOW_UNENCRYPTED:-}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-26}
    # Unhealthy once any database's last successful dump is older than BACKUP_STALE_HOURS, which a
    # daily run should never let happen: `docker compose ps` says so, where a failing run only logs.
    healthcheck:
      test: ["CMD", "sh", "/backup.sh", "--check"]
      interval: 15m
      timeout: 30s
      retries: 1
      start_period: 1h
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${HOST_DATA_ROOT}/backups:/backups
      # The public key only. The private key that opens the dumps is never on this machine.
      - ${HOST_DATA_ROOT}/backup-key:/backup-key:ro
    depends_on:
      db:
        condition: service_healthy

  # The page counter: GoatCounter, counting production's pages by path, referrer, country, browser,
  # system, screen class and language, with no cookie and nothing kept in the browser. It tells one
  # visit from the next by the address and browser, in memory for at most eight hours, and never
  # writes either. Off unless COMPOSE_PROFILES names it and SITE_ANALYTICS=on sends it production's
  # /count; its counts live in essenthos_stats on the same Postgres and are backed up with the rest.
  #
  # The only public way in is /count, through the proxy. Its dashboard is bound to the machine's
  # loopback and reached through an ssh tunnel, so the owner's sign-in never faces the internet.
  # Pinned by digest; re-pin with
  #   docker buildx imagetools inspect arp242/goatcounter:<version> --format '{{.Manifest.Digest}}'
  analytics:
    profiles: ["analytics"]
    image: arp242/goatcounter:2.7.0@sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # lib/pq reads the password from PGPASSWORD, so it is in neither the command line nor a log line.
    command:
      - serve
      - -automigrate
      - -listen=:8080
      - -tls=http
      - -db=postgresql+host=db port=5432 dbname=essenthos_stats user=essenthos_stats sslmode=disable
    environment:
      PGPASSWORD: ${STATS_PASSWORD:-}
    ports:
      - "127.0.0.1:${ANALYTICS_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  # The encrypted dumps copied off the droplet, and the copies there kept as long as the dumps are here.
  # Off unless COMPOSE_PROFILES in .env names it, because where the copy goes is the owner's to choose and
  # to pay for; the remote is defined in rclone.conf beside the data, never in this file.
  backup-offsite:
    profiles: ["offsite"]
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup-offsite.sh"]
    environment:
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup-offsite.sh:/backup-offsite.sh:ro
      - ${HOST_DATA_ROOT}/backups:/backups:ro
      - ${HOST_DATA_ROOT}/rclone:/config/rclone:ro

volumes:
  # On the machine's own disk rather than the data volume, since they hold nothing that cannot be made
  # again. A new volume takes the owner of the image's /image-cache, which is the user the API runs as.
  image-cache:
  image-cache-dev:

# One network, with the proxy at a fixed address the APIs are told to believe and every other container
# given one from the upper half. The API is published on no port, so the proxy is the only thing that
# reaches it from outside.
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
          ip_range: 10.89.0.128/25
