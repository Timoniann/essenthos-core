# The whole of a server: one Postgres, production and dev side by side, and a reverse proxy in front.
#
#   docker compose -f compose.yaml up -d                                  on the droplet
#   docker compose -f compose.yaml -f compose.rehearsal.yaml up -d        the same, on a workstation
#
# There is deliberately no compose.override.yaml: every file that applies is named on the command line,
# so nothing is applied by accident.
#
# Every value that differs between machines, and every secret, is in .env beside this file. That file
# is never committed; env.example lists what it must hold. A missing required value stops compose before
# any container starts, rather than starting one with an empty password.
#
# Nothing here builds anything. The images are built by CI and pulled by tag, and the corpus arrives
# as a release restored by `forge publish` from the machine that built it, which also puts the
# pictures its rows name under HOST_DATA_ROOT/images.

name: ${COMPOSE_PROJECT_NAME:-essenthos}

# Docker's json-file driver grows without limit by default, and a full disk on the box that holds the
# corpus is a bad afternoon. Anchors do not cross compose files, so the rehearsal override repeats it
# wherever it adds a service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

x-api: &api
  image: ${API_IMAGE:?set API_IMAGE to the essenthos-api image tag to run}
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
  # The API holds nothing but the canonical frame and a pool of connections; this stops a leak in it
  # from taking memory the database's page cache is using.
  mem_limit: 1g

x-web: &web
  image: ${WEB_IMAGE:?set WEB_IMAGE to the essenthos-web image tag to run}
  restart: unless-stopped
  logging: *logging
  mem_limit: 128m

services:
  db:
    # Pinned by digest, the same image the corpus is built and dumped with on the workstation: a dump
    # restores into its own major version or a later one, and two machines on "latest" eventually
    # disagree about what latest is. Re-pin with
    #   docker buildx imagetools inspect postgres:18.1 --format '{{.Manifest.Digest}}'
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by initdb/10-roles.sh on the first start only, to create the roles and the app databases.
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD}
      READER_DEV_PASSWORD: ${READER_DEV_PASSWORD:?set READER_DEV_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      APP_DEV_PASSWORD: ${APP_DEV_PASSWORD:?set APP_DEV_PASSWORD}
    # Sized for the deployment droplet's 8 GB, holding production's corpus and its rollback, dev's pair
    # and the app databases in one shared_buffers pool.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=2
    # A parallel hash's workers share memory through /dev/shm, which Docker caps at 64 MB. The gate a
    # publication runs peaked at 1,085 MB on the workstation with twice this work_mem.
    shm_size: 2gb
    volumes:
      # The droplet's own disk, never an attached volume: DigitalOcean's droplet backups do not
      # include attached volumes, and this is the one path the daily backup has to cover.
      - ${POSTGRES_DATA:-${HOST_DATA_ROOT:?set HOST_DATA_ROOT}/postgres}:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # Where `forge publish` uploads a release; pg_restore reads it from here.
      - ${HOST_DATA_ROOT}/releases:/releases:ro
    # Loopback only, for `forge publish`'s gate and for psql, both through an ssh tunnel.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The accounts schema, migrated by a one-shot run of the API's own image before the API starts —
  # never by the API as it boots, where two containers starting together would race each other.
  api-migrate:
    image: ${API_IMAGE}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=db;Port=5432;Database=corpus;Username=essenthos_reader
      Database__Password: ${READER_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app;Username=essenthos_app
      Accounts__Password: ${APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    environment:
      Urls: http://+:8080
      # The corpus through a role that can SELECT and nothing else. `forge publish` swaps releases by
      # renaming databases, so this name never changes.
      Database__ConnectionString: Host=db;Port=5432;Database=corpus;Username=essenthos_reader
      Database__Password: ${READER_PASSWORD}
      # Accounts, which the API owns and writes, through a role that owns that database and no other.
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app;Username=essenthos_app
      Accounts__Password: ${APP_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Cors__AllowedOrigins__0: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      # The proxy terminates TLS; without this the API believes every request arrived over plain http
      # and builds its links and its sign-in callbacks accordingly.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Images__Path: /images
    volumes:
      # The pictures the corpus's rows name. The rows arrive in the release; `forge publish` puts the
      # files here beside it, one folder per corpus, before it swaps the release in.
      - ${HOST_DATA_ROOT}/images/corpus:/images:ro
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  web:
    <<: *web

  api-dev-migrate:
    image: ${API_DEV_IMAGE:-${API_IMAGE}}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    environment:
      Database__ConnectionString: Host=db;Port=5432;Database=corpus_dev;Username=essenthos_reader_dev
      Database__Password: ${READER_DEV_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app_dev;Username=essenthos_app_dev
      Accounts__Password: ${APP_DEV_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api-dev:
    <<: *api
    image: ${API_DEV_IMAGE:-${API_IMAGE}}
    environment:
      Urls: http://+:8080
      Database__ConnectionString: Host=db;Port=5432;Database=corpus_dev;Username=essenthos_reader_dev
      Database__Password: ${READER_DEV_PASSWORD}
      Accounts__ConnectionString: Host=db;Port=5432;Database=essenthos_app_dev;Username=essenthos_app_dev
      Accounts__Password: ${APP_DEV_PASSWORD}
      # Google takes several callback addresses on one client, so dev can share production's; GitHub
      # takes one per app, so dev has an app of its own.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__GitHub__ClientId: ${GITHUB_DEV_CLIENT_ID:-}
      Authentication__GitHub__ClientSecret: ${GITHUB_DEV_CLIENT_SECRET:-}
      Cors__AllowedOrigins__0: https://${DEV_DOMAIN:?set DEV_DOMAIN}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Images__Path: /images
    volumes:
      - ${HOST_DATA_ROOT}/images/corpus_dev:/images:ro
    depends_on:
      db:
        condition: service_healthy
      api-dev-migrate:
        condition: service_completed_successfully

  web-dev:
    <<: *web
    image: ${WEB_DEV_IMAGE:-${WEB_IMAGE}}

  proxy:
    # Caddy rather than nginx: it obtains and renews the certificates itself, and it resolves the
    # upstream's address on every connection, so an API container restarted onto a new corpus is found
    # at its new address without the proxy being reloaded. lb_try_duration in the Caddyfile holds a
    # request through that restart instead of failing it.
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      DEV_DOMAIN: ${DEV_DOMAIN}
      DEV_API_DOMAIN: ${DEV_API_DOMAIN:?set DEV_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL, the address Let's Encrypt writes to about expiring certificates}
      DEV_USER: ${DEV_USER:?set DEV_USER}
      DEV_PASSWORD_HASH: ${DEV_PASSWORD_HASH:?set DEV_PASSWORD_HASH with `docker run --rm caddy:2.10-alpine caddy hash-password`}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${HOST_DATA_ROOT}/caddy/data:/data
      - ${HOST_DATA_ROOT}/caddy/config:/config
    depends_on:
      - api
      - web
      - api-dev
      - web-dev

  backup:
    # The accounts databases are the only thing on this box that cannot be rebuilt. The corpus is an
    # artefact and needs no backup; the droplet's own daily backup covers the disk this writes to, and
    # a copy off the droplet is still to be arranged.
    image: postgres:18.1@sha256:5773fe724c49c42a7a9ca70202e11e1dff21fb7235b335a73f39297d200b73a2
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DATABASES: essenthos_app essenthos_app_dev
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${HOST_DATA_ROOT}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
